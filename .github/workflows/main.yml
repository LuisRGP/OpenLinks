name: Crear Archivos Cliente

on:
  repository_dispatch:
    types: [crear_cliente]

jobs:
  crear_archivos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear JSON
        run: |
          echo '${{ github.event.client_payload.json }}' > src/data/${{ github.event.client_payload.slug }}.json

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Crear cliente ${{ github.event.client_payload.slug }}" || exit 0
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/LuisRGP/OpenLinks.git HEAD:main
:::

